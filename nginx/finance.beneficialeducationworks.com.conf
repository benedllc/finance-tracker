# Finance Tracker - Nginx Configuration
# Domain: finance.beneficialeducationworks.com
# Deploy to: /opt/bened-platform/nginx/sites/finance.beneficialeducationworks.com.conf
# Then: docker exec bened-nginx nginx -s reload

server {
    listen 80;
    server_name finance.beneficialeducationworks.com;

    # Allow ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name finance.beneficialeducationworks.com;

    ssl_certificate /etc/letsencrypt/live/finance.beneficialeducationworks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.beneficialeducationworks.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Allow file uploads for receipts
    client_max_body_size 50M;

    # API requests - proxy to Flask backend
    location /api {
        proxy_pass http://finance-tracker-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Timeouts for OCR processing
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Frontend - proxy to React app
    location / {
        proxy_pass http://finance-tracker-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no logging)
    location /api/health {
        proxy_pass http://finance-tracker-api:5000;
        proxy_set_header Host $host;
        access_log off;
    }
}
