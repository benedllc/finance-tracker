<!DOCTYPE html>
<html>
<head>
    <title>Test Login - Bened Finance</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; }
        .result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Login - Bened Finance</h1>
    <p>Test your credentials:</p>
    
    <input type="text" id="username" placeholder="Username or Email" value="admin">
    <input type="password" id="password" placeholder="Password" value="admin123">
    <button onclick="testLogin()">Test Login</button>
    
    <div id="result"></div>
    
    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'Testing...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✓ Login Successful!</strong><br>
                        User: ${data.user.username}<br>
                        Email: ${data.user.email}<br>
                        Role: ${data.user.role}<br>
                        <br>
                        You can now login at: <a href="http://localhost:3000/login">http://localhost:3000/login</a>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>✗ Login Failed</strong><br>${data.error || 'Unknown error'}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>✗ Connection Error</strong><br>${error.message}<br><br>
                    Make sure the backend server is running on port 5000`;
            }
        }
    </script>
</body>
</html>
